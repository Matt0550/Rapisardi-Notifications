version: '3'

services:
  rapisardi-notifications:
    image: matt0550/rapisardi_notifications
    ports:
      - "8000:8000"
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SSL=${SMTP_SSL}
      - SMTP_FROM=${SMTP_FROM}
      - MONGODB_HOST=${MONGODB_HOST}
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_DATABASE=${MONGODB_DATABASE}
      - MONGODB_PORT=${MONGODB_PORT}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - HOST=${HOST}
      - PORT=${PORT}
      - WORKERS=${WORKERS}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - ENABLE_RATE_LIMITING=${ENABLE_RATE_LIMITING}
      - SOSTITUZIONI_MARGHERITA_URL=${SOSTITUZIONI_MARGHERITA_URL}
      - SOSTITUZIONI_TURATI_URL=${SOSTITUZIONI_TURATI_URL}
      - SOSTITUZIONI_SERALE_URL=${SOSTITUZIONI_SERALE_URL}
      - ORARIO_URL=${ORARIO_URL}
      - PUID=1000
      - PGID=1000
    restart: unless-stopped
